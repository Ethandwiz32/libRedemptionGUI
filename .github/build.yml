name: Build libRedmptionGUI.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=$GITHUB_WORKSPACE \
            APP_BUILD_SCRIPT=$GITHUB_WORKSPACE/jni/Android.mk \
            NDK_APPLICATION_MK=$GITHUB_WORKSPACE/jni/Application.mk \
            NDK_OUT=$GITHUB_WORKSPACE/obj \
            NDK_LIBS_OUT=$GITHUB_WORKSPACE/libs

      - name: Strip debug symbols
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-all $GITHUB_WORKSPACE/libs/arm64-v8a/libRedmptionGUI.so

      - name: Zip the .so
        run: |
          cd $GITHUB_WORKSPACE/libs/arm64-v8a
          zip libRedmptionGUI.zip libRedmptionGUI.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libRedmptionGUI
          path: ${{ github.workspace }}/libs/arm64-v8a/libRedmptionGUI.zip
          retention-days: 7
